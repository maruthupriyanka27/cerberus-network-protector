<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blocked — Northbank</title>
<link rel="stylesheet" href="style.css">
<style>
  .block-wrap{
    min-height: calc(100vh - 57px);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .block-card{ width:100%; max-width: 440px; text-align:center; padding: 40px 32px; }
  .block-icon{
    width:48px; height:48px; margin:0 auto 20px; border-radius:50%;
    background: var(--block-bg); color: var(--block);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .block-card h1{ font-size:18px; margin:0 0 8px; }
  .block-card p{ color:var(--text-dim); font-size:13px; margin:0 0 18px; line-height:1.6; }
  .countdown{
    font-family:var(--font-data); font-size:32px; font-weight:600;
    color: var(--block); margin: 6px 0 18px;
  }
  .reasons{ font-family:var(--font-data); font-size:11.5px; color:var(--text-faint); margin-bottom:22px; word-break:break-word; }
  .retry-btn{
    display:inline-block; padding:10px 22px; border-radius:8px; border:1px solid var(--block);
    color:var(--block); background:transparent; font-size:13px; cursor:pointer;
  }
  .retry-btn:disabled{ opacity:.4; cursor:default; }
</style>
</head>
<body>

<div class="topnav">
  <div class="brand"><div class="brand-mark"></div>Signal Room</div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="/">Demo Site</a>
    <a href="challenge.html">PoW Challenge</a>
    <a href="simulator.html">Attack Simulator</a>
  </nav>
  <div class="status"><span class="dot" style="background:var(--block); box-shadow:0 0 0 3px var(--block-bg);"></span> block tier (score 70+)</div>
</div>

<div class="block-wrap">
  <div class="panel block-card">
    <div class="block-icon">&#10005;</div>
    <h1>This PC is blocked</h1>
    <p>Client <b class="mono">__CLIENT_IP__</b> was identified as an attack source. The website is not served to this PC until the block expires — then access returns automatically.</p>
    <div class="countdown" id="countdown">__RETRY_SECONDS__</div>
    <div class="reasons" id="reasons">__REASONS__</div>
    <button class="retry-btn" id="retryBtn" disabled>Retrying…</button>
  </div>
</div>

<script>
  let left = parseInt(document.getElementById('countdown').textContent, 10) || 0;
  const el = document.getElementById('countdown');
  const btn = document.getElementById('retryBtn');
  const fmt = (s) => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  const end = Date.now() + left * 1000;
  function tick(){
    left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    el.textContent = fmt(left);
    if (left <= 0){
      el.textContent = '00:00';
      btn.disabled = false; btn.textContent = 'Reloading…';
      setTimeout(() => location.reload(), 700);   // block expired -> back to the site
      return;
    }
    setTimeout(tick, 250);
  }
  btn.onclick = () => location.reload();
  btn.textContent = 'Unblocks automatically';
  tick();
</script>

</body>
</html>
